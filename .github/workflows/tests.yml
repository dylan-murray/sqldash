name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run ruff check sqldash tests
      - run: uv run ruff format --check sqldash tests

  test:
    name: test (${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqldash_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SQLDASH_TEST_MYSQL: "1"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: root
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      # Browser tests skip without a chromium binary. Install it on one
      # matrix cell only: four jobs all running `install --with-deps`
      # stampede apt (the flag shells out to apt-get) and some hang
      # past 40 minutes. ubuntu-24.04 already has the system libs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.python-version == '3.12'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: install chromium
        if: matrix.python-version == '3.12'
        timeout-minutes: 3
        run: uv run playwright install chromium
      # ubuntu-latest ships postgres but keeps its binaries off PATH, so the
      # postgres connector tests silently skipped here while passing locally.
      # printf over the glob rather than `ls`: shellcheck-clean, and identical
      # output whenever the glob matches. If it ever matched nothing this appends
      # the literal pattern where the old form appended an empty line, an empty
      # PATH entry being the worse of the two.
      - run: printf '%s\n' /usr/lib/postgresql/*/bin | tail -1 >> "$GITHUB_PATH"
      - run: node --test tests/*.mjs
      - run: uv run pytest -q -rs --durations=15
        timeout-minutes: 15
      - run: uv run sqldash lint examples --strict
      - run: uv build

  no-extras:
    name: test (no extras)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run pytest -q -rs
        timeout-minutes: 15

  install-check:
    name: test (pip install, fresh deps)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: ./scripts/check_install.sh
