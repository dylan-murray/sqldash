<div class="drow drow-bad" data-search="{{ b.name|lower }} {{ b.file|lower }} invalid error">
  <svg class="row-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
  <span class="row-error">{{ b.error }} — fix the file or run <code>sqldash lint</code></span>
  <span class="row-file">{{ b.file }}</span>
  <span class="row-tiles"></span>
  <span class="row-source badge badge-error">error</span>
  <span class="row-age"></span>
  <button type="button" class="card-delete row-delete" data-name="{{ b.name }}" data-title="{{ b.name }}" data-etag="{{ b.etag }}" data-file="{{ b.file }}" title="Delete dashboard" aria-label="Delete {{ b.name }}"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
</div>
