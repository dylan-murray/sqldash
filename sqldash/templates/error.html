{% extends "base.html" %}
{% block title %}{{ heading }} · sqldash{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-card">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
    <h1>{{ heading }}</h1>
    {% if file %}<code class="error-file">{{ file }}</code>{% endif %}
    <p class="error-message">{{ message }}</p>
    <div class="error-actions">
      <a class="btn btn-ghost" href="/">Back to dashboards</a>
      <span class="quiet">fix the file and refresh — or run <code>sqldash lint</code> for the full report</span>
    </div>
  </div>
</div>
{% endblock %}
